name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @qyne/shared build

      - name: Typecheck API
        run: pnpm --filter @qyne/api exec tsc --noEmit

      - name: Typecheck Dashboard
        run: |
          pnpm --filter @qyne/dashboard exec nuxt typecheck 2>&1 | tee /tmp/dash-tc.log
          # Fail only on real type errors, not the vue-router volar plugin warning.
          if grep -q "error TS" /tmp/dash-tc.log && ! grep -q "vue-router/volar" /tmp/dash-tc.log; then
            echo "::error::Dashboard has real type errors"
            exit 1
          fi

      - name: Typecheck Catalog
        run: |
          pnpm --filter @qyne/catalog exec nuxt typecheck 2>&1 | tee /tmp/cat-tc.log
          # Fail only on real type errors, not the vue-router volar plugin warning.
          if grep -q "error TS" /tmp/cat-tc.log && ! grep -q "vue-router/volar" /tmp/cat-tc.log; then
            echo "::error::Catalog has real type errors"
            exit 1
          fi

      - name: Format check
        run: pnpm exec prettier --check "apps/**/*.{ts,vue}" "packages/**/*.ts"

      - name: Run tests
        run: pnpm --filter @qyne/api exec vitest run

  agents-validation:
    name: Agents — Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        working-directory: apps/agents
        run: |
          pip install --quiet -e ".[dev]"

      - name: Typecheck agents (pyright)
        working-directory: apps/agents
        run: pyright src/

      - name: Lint agents (ruff)
        working-directory: apps/agents
        run: |
          ruff check src/
          ruff format --check src/

  # This job gates Coolify auto-deploy. Coolify's "Wait for CI" feature
  # checks that all required status checks pass before deploying.
  deploy-gate:
    name: Deploy Gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, agents-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: All checks passed
        run: echo "All CI checks passed. Coolify can proceed with deployment."
