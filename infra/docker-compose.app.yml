# Qyne — Application Containers Only
# Connects to the existing infrastructure (pg-nova, pg-agno, redis) on nova-network.
# The database and Redis containers are managed separately (Sprint 1 setup).
#
# Usage:
#   cd /opt/qyne/infra
#   docker compose -f docker-compose.app.yml up -d --build

services:
  qyne-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: qyne-api
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://qyne_app:${PG_QYNE_APP_PASSWORD}@pg-nova:5432/nova
      REDIS_URL: redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.martes.app,https://martes.app}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_BUCKET: ${R2_BUCKET}
    deploy:
      resources:
        limits: { memory: 1G }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qyne-api.rule=Host(`api.martes.app`)"
      - "traefik.http.routers.qyne-api.entrypoints=websecure"
      - "traefik.http.routers.qyne-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.qyne-api.loadbalancer.server.port=3000"
    networks:
      - nova-network

  qyne-dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    container_name: qyne-dashboard
    restart: unless-stopped
    ports: ["127.0.0.1:3101:3001"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      NUXT_HOST: "0.0.0.0"
      NUXT_PUBLIC_API_URL: https://api.martes.app
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qyne-dashboard.rule=Host(`app.martes.app`)"
      - "traefik.http.routers.qyne-dashboard.entrypoints=websecure"
      - "traefik.http.routers.qyne-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.qyne-dashboard.loadbalancer.server.port=3001"
    networks:
      - nova-network

networks:
  nova-network:
    external: true
