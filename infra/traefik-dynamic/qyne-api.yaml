# Nova API — Traefik routing (fallback for non-Docker-label setups)
# With docker-compose.prod.yml, Traefik uses Docker labels directly.
# This file is a fallback for manual setups or when Docker provider is disabled.
http:
  routers:
    qyne-api-http:
      rule: "Host(`api.martes.app`)"
      entryPoints:
        - web
      service: qyne-api
    qyne-api-https:
      rule: "Host(`api.martes.app`)"
      entryPoints:
        - websecure
      service: qyne-api
      tls:
        certResolver: letsencrypt
  services:
    qyne-api:
      loadBalancer:
        servers:
          - url: "http://nova-api:3000"
