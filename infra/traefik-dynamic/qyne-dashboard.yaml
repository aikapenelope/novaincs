# Nova Dashboard — Traefik routing (fallback for non-Docker-label setups)
http:
  routers:
    qyne-dashboard-http:
      rule: "Host(`app.martes.app`)"
      entryPoints:
        - web
      service: qyne-dashboard
    qyne-dashboard-https:
      rule: "Host(`app.martes.app`)"
      entryPoints:
        - websecure
      service: qyne-dashboard
      tls:
        certResolver: letsencrypt
  services:
    qyne-dashboard:
      loadBalancer:
        servers:
          - url: "http://nova-dashboard:3001"
