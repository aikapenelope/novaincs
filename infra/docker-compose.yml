# Qyne — Production Docker Compose
# Runs on Hetzner CX43 (8 vCPU, 16 GB RAM, Helsinki)
# Managed by Dokploy. Traefik handles SSL + routing.
#
# Containers:
#   qyne-api       — Hono API server (api.martes.app)
#   qyne-dashboard — Nuxt 3 merchant PWA (app.martes.app)
#   pg-qyne        — Business database (products, orders, customers)
#   pg-agno        — Agent database (memories, sessions, traces)
#   pg-prefect     — Workflow database (flow runs, schedules)
#   redis          — Cache + BullMQ + Prefect messaging
#   prefect        — Workflow orchestration
#
# Usage:
#   Secrets are loaded from Pulumi ESC via deploy script.
#   See deploy.sh for the full deployment flow.

services:
  # === APPLICATION SERVICES ===

  qyne-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: qyne-api
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://qyne_app:${PG_QYNE_APP_PASSWORD}@pg-qyne:5432/qyne
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.martes.app,https://martes.app}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_BUCKET: ${R2_BUCKET}
    depends_on:
      pg-qyne: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1G }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qyne-api.rule=Host(`api.martes.app`)"
      - "traefik.http.routers.qyne-api.entrypoints=websecure"
      - "traefik.http.routers.qyne-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.qyne-api.loadbalancer.server.port=3000"
    networks: [qyne-net]

  qyne-dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    container_name: qyne-dashboard
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      NUXT_HOST: "0.0.0.0"
      NUXT_PUBLIC_API_URL: https://api.martes.app
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qyne-dashboard.rule=Host(`app.martes.app`)"
      - "traefik.http.routers.qyne-dashboard.entrypoints=websecure"
      - "traefik.http.routers.qyne-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.qyne-dashboard.loadbalancer.server.port=3001"
    networks: [qyne-net]

  # === DATABASES ===

  pg-qyne:
    image: pgvector/pgvector:pg16
    container_name: pg-qyne
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: qyne
      POSTGRES_PASSWORD: ${PG_QYNE_PASSWORD}
      POSTGRES_DB: qyne
    volumes:
      - /var/lib/nova/pg-nova:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "max_connections=100"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qyne"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 2G }
    networks: [qyne-net]

  pg-agno:
    image: pgvector/pgvector:pg16
    container_name: pg-agno
    restart: unless-stopped
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: agno
      POSTGRES_PASSWORD: ${PG_AGNO_PASSWORD}
      POSTGRES_DB: agno
    volumes:
      - /var/lib/nova/pg-agno:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agno"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [qyne-net]

  pg-prefect:
    image: postgres:16-alpine
    container_name: pg-prefect
    restart: unless-stopped
    ports: ["127.0.0.1:5434:5432"]
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PG_PREFECT_PASSWORD}
      POSTGRES_DB: prefect
    volumes:
      - prefect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }
    networks: [qyne-net]

  # === CACHE + QUEUES ===

  redis:
    image: redis:7-alpine
    container_name: qyne-redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --databases 4
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [qyne-net]

  # === WORKFLOW ENGINE ===

  prefect:
    image: prefecthq/prefect:3-latest
    container_name: qyne-prefect
    restart: unless-stopped
    ports: ["127.0.0.1:4200:4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PG_PREFECT_PASSWORD}@pg-prefect:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_PASSWORD: ${REDIS_PASSWORD}
      PREFECT_REDIS_MESSAGING_DB: 2
    command: >
      bash -c "prefect server start --no-services &
               prefect server services start &
               prefect worker start --pool qyne-pool"
    depends_on:
      pg-prefect: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [qyne-net]

volumes:
  prefect_pgdata:
  redis_data:

networks:
  qyne-net:
    name: qyne-network
