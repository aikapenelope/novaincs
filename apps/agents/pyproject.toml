[project]
name = "nova-agents"
version = "0.1.0"
description = "Nova AI agents powered by Agno AgentOS"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.6.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]
