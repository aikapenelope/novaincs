[project]
name = "nova-agents"
version = "0.1.0"
description = "Nova AI agents powered by Agno AgentOS"
requires-python = ">=3.12"

dependencies = [
    # Core: Agno with AgentOS runtime (FastAPI, uvicorn, sqlalchemy, JWT, OTel)
    "agno[os]",

    # Storage: PostgreSQL (pg-agno for sessions, memory, traces)
    "agno[postgres]",
    "psycopg[binary]",

    # Models: OpenAI-compatible (OpenRouter) + Groq (fast/cheap)
    "agno[openai]",
    "agno[groq]",

    # Knowledge: LanceDB local vectors + document readers
    "agno[sqlite]",
    "lancedb",
    "pylance",
    "tantivy",
    "pypdf",

    # MCP protocol (for future integrations)
    "agno[mcp]",

    # HTTP client (for calling Nova API)
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
